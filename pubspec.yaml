name: peemart
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

  fonts:
    - family: Skiwar
      fonts:
        - asset: assets/fonts/SkiwarRegular-woOan.otf

    - family: Believe Stronger Personal Use Only
      fonts:
        - asset: assets/fonts/BelieveStrongerPersonalUseOnlyRegular-aYdXK.ttf
    
    - family: Creatball
      fonts:
        - asset: assets/fonts/CreatballItalic-5yBPj.ttf

    - family: Quicking
      fonts:
        - asset: assets/fonts/QuickingRegular-gw5KY.otf

    - family: Molgan
      fonts:
        - asset: assets/fonts/MolganRegular-YqWj2.otf

    - family: Swansea    
      fonts:
        - asset: assets/fonts/Swansea-q3pd.ttf
     